name = "pnw-clinical-bodywork"
compatibility_date = "2026-05-03"
pages_build_output_dir = "dist"

# The portal's private bucket for insurance card / license photos. Shared so
# what a patient uploads on the website is what Glen sees in the portal, which
# serves objects only through its authenticated /api/media/* route. This bucket
# must NEVER be given public access or a public domain.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "pnw-clinical-phi-media"

# Short links for the booking→intake handoff (pnwclinicalbodywork.com/i/<code>).
# The portal writes code → token here when it mints a handoff; the site reads it
# to redirect. Entries expire with the token. Shared by both projects.
[[kv_namespaces]]
binding = "LINKS"
id = "1d287f50ecf04038b78ae7ebe7f979d3"
